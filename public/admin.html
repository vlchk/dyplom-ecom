<body>


    <main class="admin-page">

        <aside class="admin-sidebar">

            <h2>SPAR Admin</h2>

            <ul>
                <li class="admin-menu-item active" data-tab="products">
                    Товари
                </li>

                <li class="admin-menu-item" data-tab="categories">
                    Категорії
                </li>

                <li class="admin-menu-item" data-tab="orders">
                    Замовлення
                </li>

                <li class="admin-menu-item" data-tab="users">
                    Користувачі
                </li>

                <li class="admin-menu-item" data-tab="stats">
                    Статистика
                </li>

                <li onclick="logoutUser()">
                    Вийти
                </li>
            </ul>

        </aside>

        <section class="admin-content">

            <div id="productsTab" class="admin-tab active">
                <h1>Товари</h1>

                <form id="adminProductForm" class="admin-form">
                    <input type="text" id="adminProductName" placeholder="Назва товару" required>
                    <input type="number" id="adminProductPrice" placeholder="Ціна" required>

                    <select id="adminProductCategory" required>
                        <option value="">Оберіть категорію</option>
                        <option value="Овочі та фрукти">Овочі та фрукти</option>
                        <option value="Молокопродукти">Молокопродукти</option>
                        <option value="М’ясо та ковбаси">М’ясо та ковбаси</option>
                        <option value="Напої">Напої</option>
                        <option value="Солодощі">Солодощі</option>
                    </select>

                    <input type="text" id="adminProductImage" placeholder="Посилання на фото">

                    <button type="submit">Додати товар</button>
                </form>
                <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Назва</th>
                            <th>Ціна</th>
                            <th>Категорія</th>
                            <th>Дії</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody"></tbody>
                </table>
                </div>
            </div>

            <div id="categoriesTab" class="admin-tab">
                <h1>Категорії</h1>
                <div id="adminCategoriesList"></div>
            </div>

            <div id="ordersTab" class="admin-tab">
                <h1>Замовлення</h1>
                <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Дата</th>
                            <th>Сума</th>
                            <th>Статус</th>
                            <th>Дії</th>
                        </tr>
                    </thead>

                    <tbody id="ordersTableBody"></tbody>
                </table>
                </div>
            </div>

            <div id="usersTab" class="admin-tab">
                <h1>Користувачі</h1>
                <div id="adminUsersList"></div>
            </div>

            <div id="statsTab" class="admin-tab">
                <h1>Статистика</h1>
                <div class="admin-stats-grid" id="adminStats"></div>
            </div>

        </section>

    </main>

    <div class="admin-modal" id="adminOrderModal">
        <div class="admin-modal-content">

            <h2 id="adminModalTitle">Замовлення</h2>

            <div id="adminModalBody"></div>

            <button class="admin-modal-ok" id="adminModalOk">Закрити</button>
        </div>
    </div>
    <script src="data.js"></script>
    <script src="main.js"></script>
    <script src="cart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"

    <div id="toast-container"></div>
    <script src="auth.js"></script>
